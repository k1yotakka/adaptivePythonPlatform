version: "3.9"

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: codementor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pylearn
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 2705
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pylearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./python-learn-backend
      dockerfile: Dockerfile
    container_name: codementor_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:2705@db:5432/pylearn
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/static
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend (vite preview) ───────────────────────────────────────────
  frontend:
    build:
      context: ./python-learn-frontend
      dockerfile: Dockerfile
    container_name: codementor_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_files: